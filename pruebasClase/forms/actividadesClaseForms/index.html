<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulario con diferentis tipos de campos</h1>
    <form action="back.php" method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <br><br>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required>

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@ejemplo.com" required>

        <br><br>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <br><br><br><br>

        <div class="filaDatos">
            <div class="columnaDatos">
                Sexo:
                <br>
                <input type="radio" name="sexo" value="Hombre"> Hombre
                <br>
                <input type="radio" name="sexo" value="Mujer"> Mujer
            </div>

            <div class="columnaDatos">
                Profesión:
                <br>
                <input type="radio" name="profesion" value="Profesor" checked> Profesor
                <br>
                <input type="radio" name="profesion" value="Programador"> Programador
                <br>
                <input type="radio" name="profesion" value="Diseñador gráfico"> Diseñador gráfico
            </div>

            <div class="columnaDatos">
                Aficiones:
                <br>
                <input type="checkbox" name="aficiones[]" value="Ciencia"> Ciencia
                <br>
                <input type="checkbox" name="aficiones[]" value="Libros"> Libros
                <br>
                <input type="checkbox" name="aficiones[]" value="Deportes"> Deportes
            </div>

            <div class="columnaDatos">
                <label for="herramienta">Elija la herramienta de diseño web que prefiera:</label>
                <br><br>
                <select name="herramienta">
                    <option value="">Herramientas web:</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Google">Google</option>
                </select>
            </div>
        </div>

        <br><br><br><br><br><br>

        <label for="comentario">Indique sus comentarios:</label>
        <br>
        <textarea name="comentario" rows="5" cols="45" placeholder="Comentario:"></textarea>

        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">
    </form>
</body>
</html>
